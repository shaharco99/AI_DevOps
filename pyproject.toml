[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-devops-assistant"
version = "0.1.0"
description = "An AI-powered DevOps assistant that analyzes logs, infrastructure, and provides intelligent recommendations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DevOps Team", email = "devops@example.com"}
]
keywords = ["devops", "ai", "llm", "assistant", "kubernetes", "ci-cd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # FastAPI & Web
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sse-starlette==2.1.3",

    # MCP protocol server
    "fastmcp==2.3.4",
    "pydantic==2.11.3",
    "pydantic-settings==2.10.1",

    # Database
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "aiosqlite==0.22.1",
    "alembic==1.13.0",

    # AI/ML
    "langchain==0.1.7",
    "langchain-community==0.0.20",
    "langchain-core==0.1.23",
    "chromadb==0.4.22",
    "ollama==0.6.1",
    "anthropic==0.116.0",

    # Kubernetes
    "kubernetes==29.0.0",

    # Monitoring
    "prometheus-client==0.19.0",

    # Utilities
    "requests==2.32.3",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.1",
    "tenacity==8.2.3",
    "slowapi==0.1.9",

    # Logging
    "python-json-logger==2.0.7",
    "opentelemetry-api==1.37.0",

    # Security
    "cryptography==43.0.3",
]

[project.scripts]
ai-devops = "ai_devops_assistant.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.23.2",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "ruff==0.1.11",
    "mypy==1.7.1",
    "pre-commit==3.6.0",
    "ipython==8.18.1",
    "ipdb==0.13.13",
    # Linting & Code Quality
    "pylint==3.0.3",
    "flake8==6.1.0",
    "isort==5.13.2",
    # Security Scanning
    "bandit==1.7.5",
    "semgrep==1.45.0",
    # Dependency Analysis
    "pip-audit==2.6.1",
    # Documentation & Markdown
    "markdownlint-cli2==0.11.0",
    # Spell Check
    "codespell==2.2.6",
    # Structured Logging
    "loguru==0.7.2",
    # Web Scraping (used by rag/scraper.py)
    "beautifulsoup4==4.12.2",
    "html5lib==1.1",
    # Prompt Management
    "jinja2==3.1.2",
]

# Fine-tuning and model-registry extras. Split out of [dev] because torch alone
# is ~2GB and pulls a large CVE surface, and neither the API nor the MCP server
# imports any of it — ml/finetuning.py and services/model_registry.py are
# opt-in tooling. Keeping them in [dev] meant every contributor and every CI lint
# job downloaded the whole ML stack to run ruff.
ml = [
    "peft==0.8.2",
    "transformers==4.36.2",
    "torch==2.1.2",
    "datasets==2.15.0",
    "huggingface-hub==1.11.0",
]

# Browser automation for scraper integration tests. Also opt-in: playwright
# downloads browser binaries on install.
browser = [
    "playwright==1.40.0",
]

test = [
    "pytest==7.4.3",
    "pytest-asyncio==0.23.2",
    "pytest-cov==4.1.0",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://github.com/yourusername/ai-devops-assistant"
Documentation = "https://github.com/yourusername/ai-devops-assistant/tree/main/docs"
Repository = "https://github.com/yourusername/ai-devops-assistant.git"
Issues = "https://github.com/yourusername/ai-devops-assistant/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_devops_assistant*"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      # directories
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | build
    | dist
    | migrations
      # merged from MCP, not yet ported; mirrors the ruff/isort/mypy excludes
  )/
  | /loaders\.py$          # TODO(phase-7.5)
)
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]
extend-ignore = ["E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "migrations",
    # Merged from MCP, not yet ported and not on any runtime path. Linting it
    # now would mean reformatting ~2900 lines that phases 3-5 are about to
    # rewrite, and would bury the real diff. Each entry is removed by the phase
    # that ports it; see MERGE_PROGRESS.md "Debt".
    "ai_devops_assistant/rag/loaders.py",           # TODO(phase-7.5)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
disallow_incomplete_defs = false
exclude = [
    "migrations/",
    "tests/",
    # Merged from MCP, not yet ported onto this codebase's contracts and not on
    # any runtime path. Each entry is removed by the phase that ports it.
    "ai_devops_assistant/rag/loaders.py",           # TODO(phase-7.5)
]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "kubernetes.*",
    "ollama.*",
    # HuggingFace datasets/transformers/peft are optional ML extras, not
    # installed in the default environment. Note that the repo also has a local
    # datasets/ data directory with no __init__.py, which python treats as a
    # namespace package and which therefore shadows the real `datasets` library
    # on sys.path. ml/finetuning.py imports it lazily inside a function, so this
    # only bites if the ML extra is actually used from the repo root.
    "datasets.*",
    "transformers.*",
    "peft.*",
    "torch.*",
    # requests ships no inline types and types-requests is not a dependency.
    "requests.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --disable-warnings"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "external: Tests that call external services",
]

[tool.coverage.run]
source = ["ai_devops_assistant"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pylint.MASTER]
# Merged from MCP, not yet ported. Without this, E0401 import-errors for
# psycopg2/pymysql/pyodbc/pypdf (dependencies that lived in MCP's deleted
# requirements) drown out real E/F findings in the code that is actually live.
# Those deps get added back to this file, pinned, by the phase that ports each
# module. Each entry is removed by the phase that ports it.
ignore-paths = [
    "^ai_devops_assistant/rag/loaders\\.py$",           # TODO(phase-7.5)
]

[tool.isort]
profile = "black"
line_length = 100
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    # Merged from MCP, not yet ported. Mirrors the ruff and mypy excludes;
    # each is removed by the phase that ports it.
    "*/rag/loaders.py",                             # TODO(phase-7.5)
]
known_first_party = ["ai_devops_assistant"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
tests = ["B201", "B301"]
skips = ["B101"]

[tool.codespell]
skip = ".git,*.pyc,.env.example,*.lock"
count = true
quiet-level = 3
ignore-words-list = ["cna", "nd", "sav", "ser", "ans"]
