name: Scheduled Security Scan

on:
  # Pushes and pull requests are scanned by ci-cd.yml; this catches new CVEs
  # in unchanged code.
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Install Python security tooling
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    - name: Run Bandit Security Linter
      run: bandit -r ai_devops_assistant -f json -o bandit-report.json

    - name: Run dependency vulnerability scan
      run: |
        # chromadb advisories have no fix and do not apply here; see .trivyignore
        pip-audit -r requirements.lock --require-hashes -f json -o pip-audit-report.json \
          --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          pip-audit-report.json
