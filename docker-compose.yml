services:
  # ========================================================================
  # PostgreSQL Database
  # ========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ai-devops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_password}
      POSTGRES_DB: ${POSTGRES_DB:-devops}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devops
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops_user} -d ${POSTGRES_DB:-devops}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================================
  # Ollama LLM Service
  # ========================================================================
  ollama:
    image: ollama/ollama:0.5.4
    container_name: ai-devops-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - devops
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # Serve only; pull a model manually the first time:
    #   docker exec ai-devops-ollama ollama pull llama3
    command: serve

  # ========================================================================
  # FastAPI Backend
  # ========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-devops-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devops_user}:${POSTGRES_PASSWORD:-devops_password}@postgres:5432/${POSTGRES_DB:-devops}
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      CHROMA_PERSIST_DIR: /data/chroma
      PROMETHEUS_URL: http://prometheus:9090
      API_ENVIRONMENT: ${API_ENVIRONMENT:-development}
      API_LOG_LEVEL: INFO
      API_KEY: ${API_KEY:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - devops
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================================================
  # MCP Protocol Server
  # ========================================================================
  # The same image as the backend, a different entrypoint. Separate container
  # rather than separate image: one build, but independent scaling, independent
  # NetworkPolicy and an independent blast radius. It serves the same
  # ToolRegistry the REST API does, so the two can never expose different tools.
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-devops-mcp
    restart: unless-stopped
    command: [ "python", "-m", "ai_devops_assistant.mcp_server" ]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devops_user}:${POSTGRES_PASSWORD:-devops_password}@postgres:5432/${POSTGRES_DB:-devops}
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      CHROMA_PERSIST_DIR: /data/chroma
      PROMETHEUS_URL: http://prometheus:9090
      API_ENVIRONMENT: ${API_ENVIRONMENT:-development}
      API_LOG_LEVEL: INFO
      # Required when API_ENVIRONMENT=production; the server refuses to start
      # without it, because the MCP transport executes tools.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_PORT: 8001
    ports:
      # Loopback only. MCP clients run alongside; nothing needs this on 0.0.0.0.
      - "127.0.0.1:8001:8001"
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devops
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ========================================================================
  # Prometheus Monitoring
  # ========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ai-devops-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - devops
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================================================
  # Grafana Visualization
  # ========================================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-devops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-worldmap-panel
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - devops
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================================================
  # Redis Cache (Optional but useful)
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: ai-devops-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - devops
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  chroma_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  devops:
    driver: bridge
