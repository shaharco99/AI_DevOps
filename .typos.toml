[files]
extend-exclude = [
    # These tests feed deliberately misspelled SQL (`nmae`, `SELCT`) to the
    # auto-correction engine.
    "tests/unit/test_sql_correction.py",
    "tests/unit/test_sql_correction_advanced.py",
    "tests/integration/test_sql_tool_correction.py",
]

[default.extend-words]
mak = "mak"
Ot = "Ot"
fo = "fo"
Fo = "Fo"
ba = "ba"
# Azure Kubernetes Service, HashiCorp Vault, and an accepted spelling.
AKS = "AKS"
Hashi = "Hashi"
unparseable = "unparseable"

[default.extend-identifiers]
excute = "excute"
